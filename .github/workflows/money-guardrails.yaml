name: Money Guardrails

# Valida el estandar de dinero y tasas sobre el repo que llama, y que fuera de ms-filestorage el blob solo se lea.
#
# Existe como workflow aparte y no como un paso de build-microservice porque este ultimo lo
# consumen repos fuera de esta plataforma, y una regla nueva no deberia romperles el build sin
# que lo hayan pedido. Cada microservicio se suscribe agregando un job a su ci.yaml.

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest

  workflow_dispatch:

jobs:
  guardrails:
    name: Estandar de dinero
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          repository: codedesignplus/workflows
          path: .guardrails

      - name: Validar estandar de dinero
        run: bash .guardrails/scripts/money-guardrails.sh .

      # Va aqui y no en un workflow propio porque este es el que ya llaman los 35 microservicios: uno nuevo obligaba
      # a tocar sus 35 ci.yml. Regla 56 de rules/ y pendings/260.
      - name: Validar que los archivos pasan por ms-filestorage
        run: python3 .guardrails/scripts/file-storage-guardrails.py .

      # Mismo motivo: un worker con jobs que no monta UseHangfireDashboard compila y arranca, pero sus jobs nunca se
      # registran ni corren. Regla 58 de rules/ y pendings/271.
      - name: Validar que los jobs recurrentes se registran en Hangfire
        run: python3 .guardrails/scripts/hangfire-guardrails.py .

      # Mismo motivo: el CVV de la tarjeta se guardaba en claro en tres micros porque el objeto de valor del SDK lo trae
      # para la pasarela, y PCI DSS no deja conservarlo. pendings/322.
      - name: Validar que el CVV no se guarda
        run: python3 .guardrails/scripts/card-data-guardrails.py .

      # Mismo motivo: dos consumidores que reemplazan el mismo documento se borran sin un error; el panel perdio 88 de 240
      # cuotas asi. Solo aplica a los micros con .concurrency-guardrails en la raiz. Regla 59 de rules/ y pendings/346.
      - name: Validar que los agregados compartidos se versionan
        run: python3 .guardrails/scripts/concurrency-guardrails.py .

      # Mismo motivo: cada micro firmaba lo que hace solo con un usuario distinto (10000000-...-0001, 00000000-...-0001 o
      # Guid.Empty, que se confunde con un dato que falta). Solo aplica a los micros de Kappali; las firmas que habia al
      # crear la regla estan en scripts/system-user-guardrails.exceptions. Regla 64 de rules/ y pendings/493.
      - name: Validar que lo que hace el sistema se firma con SystemUser
        run: python3 .guardrails/scripts/system-user-guardrails.py .

      # Mismo motivo: un campo retirado de una clase persistida se quedaba en el codigo como sumidero de solo lectura
      # (BsonValue? Legacy...) para no limpiar la base, y nadie lo retiraba despues. Se limpia con $unset al publicar.
      # Regla 65 de rules/.
      - name: Validar que no queda codigo de retrocompatibilidad de datos
        run: python3 .guardrails/scripts/legacy-fields-guardrails.py .

      # Mismo motivo: la bandeja descarta un aviso con un id que ya tiene, y dos avisos del mismo evento salian con el
      # EventId tal cual: la administracion no recibia «Impugnacion radicada». Solo aplica a los micros de Kappali.
      # pendings/623.
      - name: Validar que dos avisos del mismo evento no comparten id
        run: python3 .guardrails/scripts/notification-id-guardrails.py .
